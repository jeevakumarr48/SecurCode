name: Platform CI

# Tests, lint, type checks, migrations, browser E2E, container build and
# supply-chain scanning for the multi-tenant platform. Runs on pull requests
# with read-only permissions and no secrets.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint, tests and benchmark (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - name: Install
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Lint platform code (strict security rules)
        working-directory: backend
        run: ruff check --output-format=github app/v1 security_engine/scanner/extended.py security_engine/scanner/rules.py security_engine/scanner/runner.py security_engine/benchmark_v2.py tests_v1 migrations conftest.py
      - name: Lint legacy code (syntax and undefined names only)
        working-directory: backend
        run: ruff check --output-format=github . --select E9,F63,F7,F82
      - name: Full test suite (legacy + platform)
        working-directory: backend
        run: |
          set +e
          python -m pytest -q -rfE -p no:cacheprovider 2>&1 | tee "$RUNNER_TEMP/pytest.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Surface failures as annotations (readable without opening the log).
            grep -E "^(FAILED|ERROR) " "$RUNNER_TEMP/pytest.log" | head -8 | sed 's/^/::error title=pytest::/'
            grep -E "^E +" "$RUNNER_TEMP/pytest.log" | head -2 | sed 's/^/::error title=pytest detail::/'
          fi
          exit "$status"
      - name: Migration drift check
        working-directory: backend
        env: { SECURCODE_ENV: test, SECURCODE_DATABASE_URL: "sqlite:////tmp/drift.db" }
        run: python -m alembic upgrade head && python -m alembic check
      - name: Scanner benchmark
        working-directory: backend
        env: { SECURCODE_ENV: test, SECURCODE_DATABASE_PATH: /tmp/bench.db }
        run: |
          python -m security_engine.benchmark_v2 --json reports/scanner-benchmark-v2.json
          python -c "import json,sys; r=json.load(open('reports/scanner-benchmark-v2.json')); sys.exit(1 if r['false_positives'] or r['false_negatives'] else 0)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: scanner-benchmark, path: backend/reports/scanner-benchmark-v2.json }

  backend-postgres:
    name: Platform tests and migrations (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: ci-only-password, POSTGRES_DB: securcode_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/securcode_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Upgrade → downgrade → upgrade
        working-directory: backend
        env: { SECURCODE_ENV: test }
        run: |
          SECURCODE_DATABASE_URL=$PG_URL python -m alembic upgrade head
          SECURCODE_DATABASE_URL=$PG_URL python -m alembic check
          SECURCODE_DATABASE_URL=$PG_URL python -m alembic downgrade base
          SECURCODE_DATABASE_URL=$PG_URL python -m alembic upgrade head
      - name: Platform tests on PostgreSQL
        working-directory: backend
        run: SECURCODE_TEST_DATABASE_URL=$PG_URL python -m pytest tests_v1 -q

  frontend:
    name: Frontend typecheck, lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run typecheck
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        run: npm test
      - name: Production build (same-origin API)
        working-directory: frontend
        env: { VITE_SAME_ORIGIN_API: "true" }
        run: npm run build

  e2e:
    name: Browser end-to-end journey
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: pip install -r backend/requirements.txt
      - working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: Register → org → invite → scan → triage → remediate → rescan → export, plus tenant isolation
        working-directory: frontend
        env: { E2E_PYTHON: python }
        run: npm run test:e2e:platform
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-evidence
          path: |
            docs/screenshots/
            frontend/test-results/
          if-no-files-found: ignore

  supply-chain:
    name: Dependency and secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "22" }
      - name: Python dependency audit (pip-audit)
        run: pip install pip-audit && pip-audit -r backend/requirements.txt --strict
      - name: npm production dependency audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with: { version: v0.76.1, cache: true }
      - name: Secret scan (fixtures with fake credentials are excluded)
        run: >-
          trivy fs . --scanners secret --exit-code 1 --no-progress
          --skip-dirs scanner-fixtures --skip-dirs frontend/node_modules --skip-dirs .git

  containers:
    name: Build and scan container images
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - name: Build images
        run: |
          exec > >(tee -a "$RUNNER_TEMP/containers.log") 2>&1
          docker build -f backend/Dockerfile -t securcode-api:ci .
          docker build -f frontend/Dockerfile -t securcode-web:ci .
      - name: Image runs as non-root and the CLI imports
        run: |
          exec > >(tee -a "$RUNNER_TEMP/containers.log") 2>&1
          test "$(docker run --rm --entrypoint id securcode-api:ci -u)" = "10001"
          docker run --rm -e SECURCODE_ENV=test -e SECURCODE_DATABASE_URL=sqlite:////tmp/x.db securcode-api:ci python -c "import app.main"
      - uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with: { version: v0.76.1, cache: true }
      - name: Trivy image scan (fail on fixable HIGH/CRITICAL)
        run: |
          exec > >(tee -a "$RUNNER_TEMP/containers.log") 2>&1
          # /scanner-fixtures holds intentionally vulnerable demo code with fake
          # credentials; it is secret-scanned (and excluded) in the repo scan.
          trivy image --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL --no-progress --skip-dirs /scanner-fixtures securcode-api:ci
          trivy image --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL --no-progress securcode-web:ci
      - name: Dockerfile and compose misconfiguration scan
        run: |
          exec > >(tee -a "$RUNNER_TEMP/containers.log") 2>&1
          trivy config --exit-code 1 --severity HIGH,CRITICAL backend/Dockerfile
          trivy config --exit-code 1 --severity HIGH,CRITICAL frontend/Dockerfile
      - name: Report container failures as annotations
        if: failure()
        run: |
          grep -E "ERROR|[Ee]rror:|Total: [1-9]|CVE-|GHSA-|AVD-|DS-?[0-9]{3}" "$RUNNER_TEMP/containers.log" \
            | grep -v "^::" | cut -c1-300 | tail -n 9 | sed 's/^/::error title=containers::/' || true
          # Name the exact file each vulnerable package was found in.
          for image in securcode-api:ci securcode-web:ci; do
            skip=""; [ "$image" = securcode-api:ci ] && skip="--skip-dirs /scanner-fixtures"
            trivy image --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --no-progress -q $skip --format template \
              --template '{{ range . }}{{ $t := .Target }}{{ range .Vulnerabilities }}::error title=trivy {{ .VulnerabilityID }}::{{ .PkgName }} {{ .InstalledVersion }} in {{ $t }} at {{ .PkgPath }}{{ "\n" }}{{ end }}{{ end }}' \
              "$image" 2>/dev/null | head -n 5 || true
          done
