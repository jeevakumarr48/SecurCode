
name: SecurCode Security Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify security scanner detection
        working-directory: backend
        run: |
          python - <<'PY'
          from security_engine.scanner.engine import scan_project

          vulnerable = scan_project(
              "app/api/docs/security-demo/vulnerable.py"
          )
          safe = scan_project(
              "app/api/docs/security-demo/safe-example.py"
          )

          print("Vulnerable sample findings:", vulnerable["total_findings"])
          print("Safe sample findings:", safe["total_findings"])

          assert vulnerable["total_findings"] > 0, (
              "Scanner failed to detect the vulnerable sample"
          )
          assert safe["total_findings"] == 0, (
              "Safe sample unexpectedly produced findings"
          )

          print("Scanner verification passed.")
          PY
