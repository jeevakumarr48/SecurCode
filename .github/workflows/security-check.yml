
name: SecurCode Security Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -v

      - name: Run changed-file security gate
        working-directory: backend
        env:
          SECURCODE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          SECURCODE_FAIL_ON_SEVERITY: HIGH
        run: python -m security_engine.ci_gate

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.76.1
          cache: true

      - name: Run Trivy filesystem, dependency, and IaC scan
        working-directory: backend
        env:
          SECURCODE_FAIL_ON_SEVERITY: HIGH
        run: >-
          python -m security_engine.trivy_scan ..
          --fail-on-severity HIGH
          --timeout 600
          --skip-dir .git
          --skip-dir frontend/node_modules
          --skip-dir frontend/dist
          --skip-dir backend/app/api/docs/security-demo

      - name: Verify live Trivy JSON parsing and failure handling
        working-directory: backend
        timeout-minutes: 5
        run: python -m pytest -q security_engine/test_trivy_scan.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
